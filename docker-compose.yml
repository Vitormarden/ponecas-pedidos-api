services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/pedidos.db
    volumes:
      - pedidos_data:/data
    restart: unless-stopped

volumes:
  pedidos_data:
